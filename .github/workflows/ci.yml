name: Perimetr CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: perimetr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERIMETR_TEST_POSTGRES_URL: postgresql://perimetr:isolated-fixture@127.0.0.1:5432/perimetr_test
    services:
      postgres:
        image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: perimetr
          POSTGRES_PASSWORD: isolated-fixture
          POSTGRES_DB: perimetr_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U perimetr -d perimetr_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.runtime.txt
            requirements.dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Native verification
        run: |
          sh -n bootstrap.sh install.sh
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
          python -m alembic -c alembic.ini heads
          python -m pytest -q
          python scripts/known-problems-gate.py --phase structure
      - name: Browser contracts
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: perimetr-browser-evidence-${{ github.sha }}
          path: .tmp/browser-*/*.png
          if-no-files-found: warn

  pre-push-gate:
    name: Pre-push gate
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Evaluate seven-area contract gate
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 scripts/pre-push-gate.py
          --upstream-result "${{ needs.verify.result }}"
          --report .pre-push-gate-report.json
      - name: Preserve gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perimetr-pre-push-gate-${{ github.sha }}
          path: .pre-push-gate-report.json
          if-no-files-found: error
          retention-days: 14
