name: Release Perimetr
on:
  push:
    tags: ['perimetr-v*']
permissions:
  contents: read
concurrency:
  group: perimetr-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Validate and stage pinned inputs
        run: |
          test "$GITHUB_REF_NAME" = "perimetr-v$(cat VERSION)"
          python scripts/release-inputs.py
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and test the pushed digest
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --tag "$image:candidate-${GITHUB_SHA}" --push --provenance=true --sbom=true --metadata-file .tmp-image.json .
          digest="$(jq -er '."containerimage.digest"' .tmp-image.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "reference=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          python scripts/container-smoke.py "$image@$digest"
  release:
    needs: [quality, candidate]
    env:
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: perimetr-release
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Validate exact release and reviewed dependencies
        run: |
          test "$GITHUB_REF_NAME" = "perimetr-v$(cat VERSION)"
          python -m pip install -r requirements.txt
          python scripts/release-inputs.py
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify qualification evidence for this source and image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFICATION_RUN_ID: ${{ vars.RELEASE_QUALIFICATION_RUN_ID }}
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          test -n "$QUALIFICATION_RUN_ID"
          mkdir -p .release-evidence/qualification
          gh run download "$QUALIFICATION_RUN_ID" --name "perimetr-qualification-${GITHUB_SHA}" --dir .release-evidence/qualification
          gh run view "$QUALIFICATION_RUN_ID" --json headSha,conclusion > .release-evidence/qualification/run.json
          python scripts/verify-qualification.py .release-evidence/qualification
          python scripts/known-problems-gate.py --phase pre-signing --report .release-evidence/pre-signing.json
      - name: Package and sign the qualified digest
        env:
          IMAGE_REFERENCE: ${{ needs.candidate.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.candidate.outputs.digest }}
          UPDATER_BUNDLE_DIR: ${{ github.workspace }}/.release-inputs/updater
          RELEASE_SIGNING_KEY: ${{ secrets.PERIMETR_RELEASE_SIGNING_KEY }}
        run: |
          bash scripts/build-release.sh "$(cat VERSION)"
          node scripts/sign-release.mjs --export-public-key release-artifacts/perimetr.pem release-artifacts/perimetr-release.json
          node scripts/build-bootstrap.mjs bootstrap.sh release-artifacts/perimetr.pem release-artifacts/bootstrap.sh "$(cat VERSION)"
          python scripts/verify-release-manifest.py release-artifacts/perimetr-release.json release-artifacts/perimetr-release.json.sig.json release-artifacts/perimetr.pem
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-artifacts/*
      - name: Stage an unqualified prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --prerelease --latest=false --generate-notes --title "Perimetr $(cat VERSION)"
      - name: Verify anonymous publication and final catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/known-problems-gate.py --record published-assets --command python scripts/verify-published-assets.py release-artifacts
          python scripts/known-problems-gate.py --phase final
          gh release upload "$GITHUB_REF_NAME" known-problems-report.json --clobber
      - name: Promote the same image digest and qualified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REFERENCE: ${{ needs.candidate.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE_REFERENCE:$(cat VERSION)" "$IMAGE_REFERENCE@$IMAGE_DIGEST"
          promoted="$(docker buildx imagetools inspect "$IMAGE_REFERENCE:$(cat VERSION)" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$promoted" = "$IMAGE_DIGEST"
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: perimetr-release-evidence-${{ github.sha }}
          path: |
            .release-evidence/
            known-problems-report.json
          if-no-files-found: warn
          retention-days: 30
