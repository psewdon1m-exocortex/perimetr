# Include this file inside Perimetr's public HTTPS `server {}` block.
# The application remains the source of /robots.txt and all normal UI/API routes.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

# Reject common probe targets before they reach FastAPI.
location ~ (^|/)\. {
    return 404;
}

location ~* \.(env|ini|log|sql|bak|backup|old|swp|zip|tar|gz)$ {
    return 404;
}

# Health/status stay available on the loopback-bound application port only.
location = /v1/health {
    return 404;
}

location = /v1/public/status {
    return 404;
}

# Updater restore is a host-local callback, never a public API.
location = /v1/internal/updater/restore {
    return 404;
}

# Legacy Agent mutation routes are retained only for authenticated local clients.
location = /v1/agents/register {
    return 404;
}

location ~ ^/v1/agents/[^/]+/(heartbeat|commands/[^/]+/status)$ {
    return 404;
}

# FastAPI documentation is disabled in the app and denied again at the edge.
location = /docs { return 404; }
location ^~ /docs/ { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }
location = /swagger { return 404; }
location ^~ /swagger/ { return 404; }
location = /api-docs { return 404; }
location ^~ /api-docs/ { return 404; }
